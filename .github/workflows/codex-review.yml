name: Codex review

# Merges into main wait for Codex to finish reviewing the pull request's head
# commit, so its comments exist before anything merges and the main ruleset's
# conversation-resolution rule can hold each one to an answer.
# scripts/codex-review-gate.mjs decides; docs/runbooks/merging.md explains how
# to drive it.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Codex to finish reviewing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGERED_AT: ${{ github.event.pull_request.updated_at }}
        run: node scripts/codex-review-gate.mjs
