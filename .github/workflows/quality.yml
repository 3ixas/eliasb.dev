name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit --incremental false

      - name: Verify signal contracts
        run: pnpm verify:signals

      - name: Verify opening lifecycle
        run: pnpm verify:opening

      - name: Build with webpack
        run: SITE_INDEXABLE=true pnpm build --webpack

      - name: Verify canonical routes
        run: pnpm verify:routes

      - name: Verify release surface
        run: pnpm verify:release

      - name: Check diff whitespace
        run: git diff --check

  # The full Playwright matrix (16 projects, ~3,000 tests) takes about 45
  # minutes on one runner, so it runs as four shards in parallel.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with webpack
        run: SITE_INDEXABLE=true pnpm build --webpack

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests (shard ${{ matrix.shard }} of 4)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

      - name: Keep the report and traces of a failed shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
