name: Quality

# Every branch push, not only pull requests: a branch gets Linux CI as soon as it is
# pushed, instead of when its pull request opens at the end. A pull request from a fork
# has no push in this repository (workflows are off in forks), so its pull_request event
# runs the jobs; for a same-repository branch that event skips them, because the push
# already ran.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint, typecheck and every verify script that needs no build (see package.json).
      - name: Check
        run: pnpm check

      - name: Verify Codex review gate
        run: pnpm verify:codex-gate

      - name: Build with webpack
        run: SITE_INDEXABLE=true pnpm build --webpack

      # The verify scripts that read the build.
      - name: Check the build
        run: pnpm check:built

      - name: Check diff whitespace
        run: git diff --check

  # The full Playwright matrix (16 projects, ~3,000 tests) takes about 45
  # minutes on one runner, and WebKit at large sizes is slowest, so it runs
  # as eight shards in parallel.
  e2e:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    # Shards take 8 to 12 minutes in the image (#272), so 20 leaves room for a slow pull.
    timeout-minutes: 20
    # The image carries Chromium, WebKit and their system packages, so nothing is
    # downloaded or apt-installed per run. That install used to stall shards for the whole
    # 30 minutes (#271): WebKit needs about 300 apt packages, and the runner's Ubuntu mirror
    # can serve them at under 100 kB/s. The tag must move with @playwright/test in
    # pnpm-lock.yaml, or the browsers will not match the library.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Chromium needs more shared memory than a container gets by default.
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with webpack
        run: SITE_INDEXABLE=true pnpm build --webpack

      - name: End-to-end tests (shard ${{ matrix.shard }} of 8)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/8

      # Also when the shard runs out of time, which cancels rather than fails it.
      - name: Keep the report and traces of a failed shard
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
